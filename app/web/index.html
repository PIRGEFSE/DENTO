<!DOCTYPE html>
<html>
<head>
  <!--
    DentoMax — Anatomía Radiográfica Maxilofacial
    Flutter Web — renderer: canvaskit (mejor calidad para visualización de imágenes médicas)
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plataforma educativa de anatomía radiográfica maxilofacial — Universidad de Talca">

  <!-- Configuración de viewport para web responsiva -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DentoMax">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DentoMax – Anatomía Radiográfica</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fondo oscuro mientras carga la app Flutter */
    body {
      background-color: #0a0a0a;
      margin: 0;
      padding: 0;
    }
    /* Spinner de carga inicial */
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      color: #C41E3A;
      font-family: sans-serif;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <!-- Pantalla de carga pre-Flutter -->
  <div id="loading">
    <span>DENTOMAX</span>
  </div>

  <script>
    // Configuración del renderer canvaskit para mejor calidad en imágenes médicas
    window.flutterConfiguration = {
      renderer: "canvaskit"
    };
  </script>

  <!-- Bootstrap del engine Flutter Web -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
